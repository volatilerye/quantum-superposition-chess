<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quantum Superposition Chess</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <section class="board-wrap">
      <div id="captured-top" class="captured"></div>
      <div id="board" class="board" data-i18n-aria="boardLabel" aria-label="Chess board"></div>
      <div id="captured-bottom" class="captured"></div>
      <div id="status" class="status" data-i18n="loading">Loading…</div>
    </section>

    <aside class="panel">
      <div class="title-row">
        <h1 data-i18n="pageTitle">Quantum Superposition Chess</h1>
        <select id="lang" aria-label="Language / 言語">
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </div>

      <fieldset>
        <legend data-i18n="newGame">New game</legend>
        <div class="row">
          <label><span data-i18n="opponent">Opponent</span>
            <select id="opponent">
              <option value="engine" data-i18n="optEngine">Engine</option>
              <option value="human" data-i18n="optHuman">Human (same screen, taking turns)</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label class="inline"><span data-i18n="setup">Setup</span>
            <select id="setup">
              <option value="0" data-i18n="setup0" selected>Both superposed</option>
              <option value="1" data-i18n="setup1">Only White classical</option>
              <option value="2" data-i18n="setup2">Only Black classical</option>
              <option value="3" data-i18n="setup3">Both classical</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label id="color-box"><span data-i18n="side">Play as</span>
            <select id="color">
              <option value="w" data-i18n="optWhite">White (moves first)</option>
              <option value="b" data-i18n="optBlack">Black (moves second)</option>
              <option value="r" data-i18n="optRandom">Random</option>
            </select>
          </label>
          <button id="new-game" class="primary" data-i18n="start">Start</button>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="engine">Engine</legend>
        <label class="inline"><span data-i18n="strength">Strength</span>
          <select id="level">
            <option value="1" data-i18n="levelOpt" data-n="1">Level 1</option>
            <option value="2" data-i18n="levelOpt" data-n="2">Level 2</option>
            <option value="3" data-i18n="levelOpt" data-n="3" selected>Level 3</option>
            <option value="4" data-i18n="levelOpt" data-n="4">Level 4</option>
            <option value="5" data-i18n="levelOpt" data-n="5">Level 5</option>
            <option value="6" data-i18n="levelOpt" data-n="6">Level 6</option>
            <option value="7" data-i18n="levelOpt" data-n="7">Level 7</option>
            <option value="8" data-i18n="levelOpt" data-n="8">Level 8</option>
            <option value="9" data-i18n="levelOpt" data-n="9">Level 9</option>
            <option value="10" data-i18n="levelOpt" data-n="10">Level 10</option>
            <option value="11" data-i18n="levelOpt" data-n="11">Level 11</option>
          </select>
        </label>
        <p class="muted small" data-i18n="changeNote">Changes take effect from the next move.</p>
      </fieldset>

      <div class="row buttons">
        <button id="undo" data-i18n="undo">Undo</button>
        <button id="flip" data-i18n="flip">Flip board</button>
        <button id="copy-pgn" data-i18n="copy">Copy game record</button>
      </div>
      <label class="check small">
        <input type="checkbox" id="overlay">
        <span data-i18n="overlay">Show possible kinds stacked on top of each other</span>
      </label>
      <label class="check small">
        <input type="checkbox" id="guard">
        <span data-i18n="guard">Block moves that leave none of your pieces on the board able to be the king</span>
      </label>

      <ol id="moves" class="moves"></ol>

      <section class="rules small">
        <h2 data-i18n="rules">Rules</h2>
        <div class="rules-box" tabindex="0">
          <ul>
            <li data-i18n="rule1"></li>
            <li data-i18n="rule2"></li>
            <li data-i18n="rule3"></li>
            <li data-i18n="rule4"></li>
            <li data-i18n="rule5"></li>
            <li data-i18n="rule6"></li>
            <li data-i18n="rule7"></li>
          <li data-i18n="rule8"></li>
          </ul>
          <p class="muted" data-i18n="hoverNote"></p>
        </div>
      </section>


    </aside>
  </main>

  <div id="debug" class="debug" hidden></div>

  <dialog id="choice">
    <p id="choice-title"></p>
    <div id="choice-buttons" class="choice-buttons"></div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quantum Superposition Chess</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <section class="board-wrap">
      <div id="captured-top" class="captured"></div>
      <div id="board" class="board" data-i18n-aria="boardLabel" aria-label="Chess board"></div>
      <div id="captured-bottom" class="captured"></div>
      <div id="status" class="status" data-i18n="loading">Loading…</div>
    </section>

    <aside class="panel">
      <div class="title-row">
        <h1 data-i18n="pageTitle">Quantum Superposition Chess</h1>
        <select id="lang" aria-label="Language / 言語">
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </div>

      <fieldset>
        <legend data-i18n="newGame">New game</legend>
        <div class="row">
          <label><span data-i18n="opponent">Opponent</span>
            <select id="opponent">
              <option value="engine" data-i18n="optEngine">Engine</option>
              <option value="human" data-i18n="optHuman">Human (same screen, taking turns)</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label id="color-box"><span data-i18n="side">Play as</span>
            <select id="color">
              <option value="w" data-i18n="optWhite">White (moves first)</option>
              <option value="b" data-i18n="optBlack">Black (moves second)</option>
              <option value="r" data-i18n="optRandom">Random</option>
            </select>
          </label>
          <button id="new-game" class="primary" data-i18n="start">Start</button>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="engine">Engine</legend>
        <label class="inline"><span data-i18n="thinkTime">Thinking time</span>
          <select id="movetime">
            <option value="1000" data-i18n="seconds" data-n="1" selected>1 s</option>
            <option value="2000" data-i18n="seconds" data-n="2">2 s</option>
            <option value="3000" data-i18n="seconds" data-n="3">3 s</option>
            <option value="4000" data-i18n="seconds" data-n="4">4 s</option>
            <option value="5000" data-i18n="seconds" data-n="5">5 s</option>
          </select>
        </label>
        <p class="muted small" data-i18n="changeNote">Changes take effect from the next move.</p>
      </fieldset>

      <div class="row buttons">
        <button id="undo" data-i18n="undo">Undo</button>
        <button id="flip" data-i18n="flip">Flip board</button>
        <button id="copy-pgn" data-i18n="copy">Copy game record</button>
      </div>

      <ol id="moves" class="moves"></ol>

      <section class="rules small">
        <h2 data-i18n="rules">Rules</h2>
        <div class="rules-box" tabindex="0">
          <ul>
            <li data-i18n="rule1"></li>
            <li data-i18n="rule2"></li>
            <li data-i18n="rule3"></li>
            <li data-i18n="rule4"></li>
            <li data-i18n="rule5"></li>
            <li data-i18n="rule6"></li>
            <li data-i18n="rule7"></li>
          </ul>
          <p class="muted" data-i18n="hoverNote"></p>
        </div>
      </section>


    </aside>
  </main>

  <div id="debug" class="debug" hidden></div>

  <dialog id="choice">
    <p id="choice-title"></p>
    <div id="choice-buttons" class="choice-buttons"></div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>

[package]
name = "chess-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Dependency-free chess rules core compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
